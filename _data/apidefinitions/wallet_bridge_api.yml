---
- name: :wallet_bridge_api
  since: HF26
  description: |
    Required for `cli_wallet` interactions.  Remember that you need to add
    `plugin = wallet_bridge_api` in your `config.ini` file if you are going to
    use `cli_wallet`.

    Wallet Bridge methods receive one variant argument containing their
    positional argument array.  For methods with arguments, JSON-RPC `params`
    therefore has the form `[[...]]`; zero-argument methods use `[]`.
    
    See: [Hive HardFork 26 Jump Starter Kit](https://hive.blog/hive-160391/@gtg/hive-hardfork-26-jump-starter-kit)
