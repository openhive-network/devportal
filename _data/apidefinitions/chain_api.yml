---
- name: Chain API
  description: |
    Used to submit signed transactions to the chain plugin.

    Also see: [network_broadcast_api.broadcast_transaction]({{ '/apidefinitions/#network_broadcast_api.broadcast_transaction' | relative_url }})
  methods:
  - api_method: chain_api.push_transaction
    purpose: |
      Accepts a signed transaction and attempts to push it to the chain.

      The response reports whether the transaction was accepted. If validation
      fails, `success` is `false` and `error` contains the failure detail.
    parameter_json: |
      {
        "ref_block_num": 0,
        "ref_block_prefix": 0,
        "expiration": "1970-01-01T00:00:00",
        "operations": [],
        "extensions": [],
        "signatures": []
      }
    expected_response_json: |
      {
        "success": false,
        "error": "transaction validation error"
      }
    curl_examples:
      - '{"jsonrpc":"2.0", "method":"chain_api.push_transaction", "params":{"ref_block_num":1097,"ref_block_prefix":2181793527,"expiration":"2016-03-24T18:00:21","operations":[{"type":"vote_operation","value":{"voter":"hiveio","author":"alice","permlink":"a-post-by-alice","weight":10000}}],"extensions":[],"signatures":[]}, "id":1}'
    expected_curl_responses:
      - transaction validation error
    client_docs:
      - '[hive-js](https://gitlab.syncad.com/hive/hive-js/tree/master/doc#broadcast-api)'
      - '[beem](https://beem.readthedocs.io/en/latest/beem.transactionbuilder.html)'
      - '[hive-ruby](https://www.rubydoc.info/gems/hive-ruby/Hive/TransactionBuilder)'
