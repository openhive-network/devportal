image: ruby:3.1.6

variables:
  BUNDLE_PATH: vendor/bundle

stages:
  - build
  - test
  - deploy_staging
  - deploy_master

cache:
  key: "$CI_PROJECT_ID-bundle-v1"
  paths:
    - vendor/bundle/

build:
  image: ruby:3.1.6
  stage: build
  script:
    - ls -l
    - gem install bundler -v 2.3.19
    - bundle install
    - bundle exec jekyll build -d public
    - echo "BUILD SUCCESSFULLY"
  artifacts:
    paths:
      - public
    expire_in: 20 mins
  # environment:
  #   name: development
  # only:
  #   - develop
  tags:
    - public-runner-docker

html_proofer:
  image: ruby:3.1.6
  stage: test
  dependencies: []
  script:
    - gem install bundler -v 2.3.19
    - bundle install
    - bundle exec rake test:proof:full
  tags:
    - public-runner-docker

deploy_staging:
  stage: deploy_staging
  image: python:3.11
  dependencies:
    - build
  script:
    - export AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
    - export AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
    - export S3_BUCKET_NAME=$S3_BUCKET_NAME_STAGING
    - export DISTRIBUTION_ID=$DISTRIBUTION_ID
    - pip install awscli --upgrade --user
    - export PATH=~/.local/bin:$PATH
    - aws s3 sync --acl public-read --delete public $S3_BUCKET_NAME_STAGING
    #- aws cloudfront create-invalidation --distribution-id $DISTRIBUTION_ID --paths '/*'
    - echo "DEPLOYED SUCCESSFULLY TO STAGING - developers-staging.hive.io"
  environment:
    name: development
  only:
    - develop
  tags:
    - public-runner-docker

deploy_master:
  stage: deploy_master
  image: python:3.11
  dependencies:
    - build
  script:
    - export AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
    - export AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
    - export S3_BUCKET_NAME=$S3_BUCKET_NAME_PRODUCTION
    - export DISTRIBUTION_ID=$DISTRIBUTION_ID
    - pip install awscli --upgrade --user
    - export PATH=~/.local/bin:$PATH
    - aws s3 sync --acl public-read --delete public $S3_BUCKET_NAME_PRODUCTION
    - aws cloudfront create-invalidation --distribution-id $DISTRIBUTION_ID --paths '/*'
    - echo "DEPLOYED SUCCESSFULLY TO PRODUCTION - developers.hive.io"
  environment:
    name: production
  only:
    - master
  tags:
    - public-runner-docker
